name: Release DMG

# Triggered automatically when a version tag (v*) is pushed.
# Produces an unsigned .app bundle inside a DMG, published as a GitHub Release.
#
# NOTE: The app is unsigned. On first launch macOS Gatekeeper will block it.
# To open it, right-click the app → Open, then confirm in the dialog.
# Or strip the quarantine attribute after downloading the DMG:
#   xattr -d com.apple.quarantine BusinessBar.dmg

on:
  push:
    tags:
      - 'v*'

jobs:
  dmg:
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Write .env
      env:
        GOOGLE_CLIENT_NUMBER: ${{ secrets.GOOGLE_CLIENT_NUMBER }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        SPARKLE_APPCAST_URL: ${{ vars.SPARKLE_APPCAST_URL }}
        SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      run: |
        # Write secrets to .env so bundle_app.sh can read them and inject
        # into BUILT artifacts (not source files).  The .env file is in
        # .gitignore and never committed.
        cat > .env <<EOF
        GOOGLE_CLIENT_NUMBER=${GOOGLE_CLIENT_NUMBER}
        GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
        SPARKLE_APPCAST_URL=${SPARKLE_APPCAST_URL}
        SPARKLE_PUBLIC_ED_KEY=${SPARKLE_PUBLIC_ED_KEY}
        EOF
        echo "  ✓ .env written for bundle_app.sh"

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27'

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Build, assemble, sign and create DMG
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "DMG_NAME=BusinessBar-${VERSION}.dmg" >> "$GITHUB_ENV"

        # The dmg flag stages the app next to an /Applications symlink
        # before imaging, so the mounted DMG supports drag-install.
        ./bundle_app.sh "$VERSION" "${{ github.run_number }}" dmg

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: BusinessBar-${{ env.VERSION }}
        path: ${{ env.DMG_NAME }}
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: BusinessBar ${{ env.VERSION }}
        files: ${{ env.DMG_NAME }}
        generate_release_notes: true

    - name: Publish Sparkle appcast to GitHub Pages
      env:
        GH_TOKEN: ${{ github.token }}
        SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        SPARKLE_APPCAST_URL: ${{ vars.SPARKLE_APPCAST_URL }}
      run: |
        # Regenerate appcast.xml listing every release DMG with EdDSA
        # signatures, then publish it on the gh-pages branch. Pages serves
        # the feed; enclosures point straight at GitHub Releases downloads.
        set -euo pipefail
        if [ -z "$SPARKLE_PRIVATE_ED_KEY" ] || [ -z "$SPARKLE_APPCAST_URL" ]; then
          echo "  ⚠ SPARKLE_PRIVATE_ED_KEY or SPARKLE_APPCAST_URL not set; skipping appcast"
          exit 0
        fi

        # Collect every release DMG with its download URL, marketing version,
        # and the CFBundleVersion that shipped in it (the release run number).
        ARGS=""
        for TAG in $(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | sort -V); do
          VERSION=${TAG#v}
          RUN_NUMBER=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=release.yml --branch "$TAG" --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          [ -z "$RUN_NUMBER" ] && { echo "  ⚠ no release run for $TAG, skipping it"; continue; }
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BusinessBar-$VERSION.dmg"
          ARGS="$ARGS $URL|$VERSION|$RUN_NUMBER"
        done

        swift scripts/appcast/generate_appcast.swift appcast.xml "$SPARKLE_APPCAST_URL" "$SPARKLE_PRIVATE_ED_KEY" $ARGS

        # Publish appcast.xml alone on the gh-pages branch (orphan if absent).
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout --orphan gh-pages
        git rm -rq --cached . 2>/dev/null || true
        find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'appcast.xml' -exec rm -rf {} +
        git add appcast.xml
        git commit -m "appcast: add v${GITHUB_REF_NAME#v}" -m "Generated by release workflow run $GITHUB_RUN_NUMBER."
        git push origin gh-pages --force