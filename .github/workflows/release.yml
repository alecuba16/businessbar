name: Release DMG

# Manually triggered from GitHub Actions UI (Actions → Release DMG → Run workflow).
# Produces an unsigned .app bundle inside a DMG, uploaded as a workflow artifact.
#
# NOTE: The app is unsigned. On first launch macOS Gatekeeper will block it.
# To open it, right-click the app → Open, then confirm in the dialog.
# Or strip the quarantine attribute after downloading the DMG:
#   xattr -d com.apple.quarantine BusinessBar.dmg

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.0) — written into Info.plist'
        required: true
        default: '1.0.0'

jobs:
  dmg:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Write .env for bundle_app.sh
      env:
        GOOGLE_CLIENT_NUMBER: ${{ secrets.GOOGLE_CLIENT_NUMBER }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        SPARKLE_APPCAST_URL: ${{ vars.SPARKLE_APPCAST_URL }}
        SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      run: |
        # Write secrets to .env so bundle_app.sh can read them and inject
        # into BUILT artifacts (not source files).  The .env file is in
        # .gitignore and never committed.
        cat > .env <<EOF
        GOOGLE_CLIENT_NUMBER=${GOOGLE_CLIENT_NUMBER}
        GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
        SPARKLE_APPCAST_URL=${SPARKLE_APPCAST_URL}
        SPARKLE_PUBLIC_ED_KEY=${SPARKLE_PUBLIC_ED_KEY}
        EOF
        echo "  ✓ .env written for bundle_app.sh"

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Build, assemble and sign
      run: |
        bash scripts/bundle_app.sh \
          "${{ github.event.inputs.version }}" \
          "${{ github.run_number }}"

    - name: Create DMG
      run: |
        set -euo pipefail
        VERSION="${{ github.event.inputs.version }}"
        DMG="BusinessBar-${VERSION}.dmg"

        hdiutil create \
          -volname "BusinessBar ${VERSION}" \
          -srcfolder BusinessBar.app \
          -ov -format UDZO \
          "$DMG"

        echo "DMG_NAME=$DMG" >> "$GITHUB_ENV"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: BusinessBar-${{ github.event.inputs.version }}
        path: ${{ env.DMG_NAME }}
        retention-days: 30