name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve dependencies
      run: swift package resolve

    - name: Build (debug)
      run: swift build

    - name: Build (release)
      run: swift build -c release

    - name: Inject credentials into built artifacts
      env:
        GOOGLE_CLIENT_NUMBER: ${{ secrets.GOOGLE_CLIENT_NUMBER }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        # Patch credentials.json in the SPM-built resource bundle, NOT the
        # source file.  This keeps the source tree clean — no git-dirty state.
        BUILT_BUNDLE=".build/arm64-apple-macosx/release/BusinessBar_BusinessBar.bundle"
        BUILT_CREDS="$BUILT_BUNDLE/credentials.json"

        if [ -f "$BUILT_CREDS" ] && [ -n "$GOOGLE_CLIENT_NUMBER" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
          cat > "$BUILT_CREDS" <<EOF
        {
            "google_client_number": "${GOOGLE_CLIENT_NUMBER}",
            "google_client_secret": "${GOOGLE_CLIENT_SECRET}"
        }
        EOF
          echo "  ✓ Built credentials.json patched with real values"

          # Remove credentials.local.json from the built bundle so it never
          # ships in a release (real values are already in credentials.json).
          rm -f "$BUILT_BUNDLE/credentials.local.json"
          echo "  ✓ Removed credentials.local.json from built bundle"
        else
          echo "  ⚠ Built credentials.json not found or secrets not set — skipping credential injection"
        fi

    - name: Upload release binary
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: BusinessBar-${{ github.sha }}
        path: .build/release/BusinessBar
        retention-days: 7