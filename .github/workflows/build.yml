name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Inject credentials and Sparkle config
      env:
        GOOGLE_CLIENT_NUMBER: ${{ secrets.GOOGLE_CLIENT_NUMBER }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        SPARKLE_APPCAST_URL: ${{ vars.SPARKLE_APPCAST_URL }}
        SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      run: |
        # Write real values into credentials.json (bakes them into the binary)
        cat > BusinessBar/Resources/credentials.json <<EOF
        {
            "google_client_number": "${GOOGLE_CLIENT_NUMBER}",
            "google_client_secret": "${GOOGLE_CLIENT_SECRET}"
        }
        EOF

        # Patch Info.plist URL scheme with the real client number
        /usr/libexec/PlistBuddy \
          -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 com.googleusercontent.apps.${GOOGLE_CLIENT_NUMBER}" \
          BusinessBar/Resources/Info.plist

        # Patch Sparkle appcast URL (if the variable is set)
        if [ -n "$SPARKLE_APPCAST_URL" ]; then
          /usr/libexec/PlistBuddy \
            -c "Set :SUFeedURL ${SPARKLE_APPCAST_URL}" \
            BusinessBar/Resources/Info.plist
          echo "  ✓ Info.plist SUFeedURL patched"
        fi

        # Patch Sparkle public EdDSA key (if the secret is set)
        if [ -n "$SPARKLE_PUBLIC_ED_KEY" ]; then
          /usr/libexec/PlistBuddy \
            -c "Set :SUPublicEDKey ${SPARKLE_PUBLIC_ED_KEY}" \
            BusinessBar/Resources/Info.plist
          echo "  ✓ Info.plist SUPublicEDKey patched"
        fi

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve dependencies
      run: swift package resolve

    - name: Build (debug)
      run: swift build

    - name: Build (release)
      run: swift build -c release

    - name: Upload release binary
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: BusinessBar-${{ github.sha }}
        path: .build/release/BusinessBar
        retention-days: 7