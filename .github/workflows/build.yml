name: Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    # xcode-27 image: macOS 27 + Xcode 27 (Swift 6.4), matching the toolchain
    # this repo targets. The plugin helper is a no-op under full Xcode.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history for git describe in snapshot versioning

    - name: Set coverage output directory
      run: echo "COVERAGE_OUTPUT=$RUNNER_TEMP/businessbar-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27'

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: |
          .build/artifacts
          .build/checkouts
          .build/repositories
        key: ${{ runner.os }}-spm-inputs-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-inputs-

    - name: Resolve dependencies
      run: swift package resolve

    - name: Test full application and enforce coverage
      run: bash scripts/test-coverage.sh --with-xctest --output-dir "$COVERAGE_OUTPUT"

    - name: Upload coverage evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: whole-application-coverage
        path: |
          ${{ env.COVERAGE_OUTPUT }}/summary.json
          ${{ env.COVERAGE_OUTPUT }}/coverage.json
          ${{ env.COVERAGE_OUTPUT }}/coverage.lcov
          ${{ env.COVERAGE_OUTPUT }}/profiles.json
          ${{ env.COVERAGE_OUTPUT }}/run/manifest.json
          ${{ env.COVERAGE_OUTPUT }}/compiler-lines.lcov
          ${{ env.COVERAGE_OUTPUT }}/evidence/
          ${{ env.COVERAGE_OUTPUT }}/run/run.*/logs/
        if-no-files-found: warn
        retention-days: 7

    - name: Build (release)
      # Plugin helper is a no-op under full Xcode (CI has it), but keeps
      # this step identical to the local CLT path.
      run: swift build -c release $(scripts/swift-clt-plugins.sh flags)

    - name: Assemble .app (smoke test)
      run: |
        # Assemble the .app bundle to catch Info.plist, resource, or
        # code-signing issues early.  No credentials are injected —
        # placeholder values are fine for CI validation.
        ./bundle_app.sh
        echo "  ✓ BusinessBar.app assembled successfully"

    - name: Verify .app bundle
      run: |
        codesign --verify --deep --strict BusinessBar.app
        echo "  ✓ Code signature verified"
        # Sanity-check that version was written by snapshot versioning.
        # PlistBuddy reads the file directly — more reliable than
        # `defaults read` which fails in CI environments.
        VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" BusinessBar.app/Contents/Info.plist)
        BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" BusinessBar.app/Contents/Info.plist)
        echo "  ✓ Version: ${VERSION} (build ${BUILD})"
