name: Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history for git describe in snapshot versioning

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve dependencies
      run: swift package resolve

    - name: Run tests
      run: swift test

    - name: Build (release)
      run: swift build -c release

    - name: Assemble .app (smoke test)
      run: |
        # Assemble the .app bundle to catch Info.plist, resource, or
        # code-signing issues early.  No credentials are injected —
        # placeholder values are fine for CI validation.
        ./bundle_app.sh
        echo "  ✓ BusinessBar.app assembled successfully"

    - name: Verify .app bundle
      run: |
        codesign --verify --deep --strict BusinessBar.app
        echo "  ✓ Code signature verified"
        # Sanity-check that version was written by snapshot versioning
        VERSION=$(defaults read BusinessBar.app/Contents/Info.plist CFBundleShortVersionString)
        BUILD=$(defaults read BusinessBar.app/Contents/Info.plist CFBundleVersion)
        echo "  ✓ Version: ${VERSION} (build ${BUILD})"